document.addEventListener('input',function(e){var t=e.target;if(t.id!=='obi')return;obSet(OBQ[OB.i].k,t.value);var n=document.getElementById('obn');if(n)n.disabled=!obValid()});
document.addEventListener('keydown',function(e){if(e.target.id==='obi'&&e.key==='Enter'){e.preventDefault();var n=document.getElementById('obn');if(n&&!n.disabled)n.click()}if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card[data-a=open]')){e.preventDefault();e.target.click()}});
/* ===== Opname ===== */
var REC={files:null,urls:[],vid:0,err:''};
function opname(){var h='<h1>Opname</h1><div class="card"><h2>Maak een foto of video</h2><div class="mut">Film jezelf van opzij tijdens een oefening. Kies daarna hieronder welke oefening je deed.</div><div class="row"><label class="btn o">📷 Foto maken<input data-rec="1" type="file" accept="image/*" capture="environment" hidden></label><label class="btn o">🎥 Video opnemen<input data-rec="1" type="file" accept="video/*" capture="environment" hidden></label><label class="btn s">Uit galerij<input data-rec="1" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" multiple hidden></label></div>'+(REC.err?'<div class="warn">'+esc(REC.err)+'</div>':'')+'</div>';
if(REC.files){h+='<div class="card"><h2>Jouw opname</h2>'+(REC.vid?'<video src="'+REC.urls[0]+'" controls playsinline style="width:100%;border-radius:12px;max-height:50vh"></video>':'<div class="row">'+REC.urls.map(function(u){return'<img src="'+u+'" alt="Opname" style="max-width:100%;max-height:260px;border-radius:12px">'}).join('')+'</div>')+'</div><div class="card"><h2>Welke oefening heb je gedaan?</h2><div class="mut">Tik op de oefening, dan analyseert de AI je opname.</div><div class="pm">'+EX.map(function(e){return'<button type="button" class="btn s" data-rc="1" data-id="'+e.id+'">'+esc(e.naam)+'</button>'}).join('')+'</div><div id="xres" aria-live="polite" style="display:flex;flex-direction:column;gap:8px"></div></div>'}
return h}
document.addEventListener('change',function(e){var t=e.target;if(!t.dataset||!t.dataset.rec)return;var fs=[].slice.call(t.files);t.value='';if(!fs.length)return;REC.urls.forEach(function(u){URL.revokeObjectURL(u)});var v=fs.filter(function(f){return/^video\//.test(f.type)})[0],im=fs.filter(function(f){return/^image\/(jpeg|png|webp)$/.test(f.type)}).slice(0,8);REC.err='';REC.files=v?[v]:im.length?im:null;REC.vid=v?1:0;REC.urls=REC.files?REC.files.map(function(f){return URL.createObjectURL(f)}):[];if(!REC.files)REC.err='Dit bestandstype wordt niet ondersteund.';else if(v&&v.size>MAX_VID){REC.err='Video is groter dan 60 MB.';REC.files=null;REC.urls=[]}render('k')});
document.addEventListener('click',function(e){var b=e.target.closest('[data-rc]');if(!b||!REC.files)return;[].forEach.call(document.querySelectorAll('[data-rc]'),function(x){x.classList.toggle('sel',x===b)});analyseEx(REC.files,b.dataset.id)});
/* ===== Wedstrijden ===== */
function mdays(d){return Math.round((new Date(d+'T12:00:00')-new Date(iso(NOW)+'T12:00:00'))/864e5)}
function mlist(){return(S.match||[]).filter(function(m){return mdays(m.date)>=0}).sort(function(a,b){return a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||'')})}
function mtxt(m){var n=mdays(m.date);return n===0?'Vandaag':n===1?'Morgen':'Over '+n+' dagen'}
function nextMatch(){var m=mlist()[0];return'<div class="card"><h3>Volgende wedstrijd</h3>'+(m?'<div><b>'+(m.opp?'vs '+esc(m.opp):'Wedstrijd')+'</b>'+(m.ha?' · '+m.ha:'')+'</div><div class="mut">'+fmtD(m.date)+(m.time?' · '+esc(m.time):'')+' · '+mtxt(m)+'</div>'+(mdays(m.date)<=1?'<div class="warn">Geen zware training vlak voor je wedstrijd.</div>':''):'<span class="mut">Nog geen wedstrijd gepland.</span><button class="btn s" data-a="tab" data-t="planning">Plan er een</button>')+'</div>'}
function matchCard(){var l=mlist();return'<div class="card" id="match"><h2>Wedstrijden</h2><div class="mut">Wanneer speel je?</div>'+(l.length?l.map(function(m){return'<div class="row"><b style="flex:1">'+fmtD(m.date)+(m.time?' · '+esc(m.time):'')+' · '+(m.opp?esc(m.opp):'Wedstrijd')+(m.ha?' ('+m.ha+')':'')+' <span class="mut">'+mtxt(m)+'</span></b><button class="btn s" data-mc="del" data-id="'+m.id+'" aria-label="Verwijder">✕</button></div>'}).join(''):'<span class="mut">Nog geen wedstrijden.</span>')+'<div class="row"><input id="md" type="date" min="'+iso(NOW)+'"><input id="mt2" type="time"><input id="mo" maxlength="30" placeholder="Tegenstander" style="flex:1;min-width:120px"><select id="mh"><option>Thuis</option><option>Uit</option></select><button class="btn" data-mc="add">Toevoegen</button></div></div>'}
document.addEventListener('click',function(e){var b=e.target.closest('[data-mc]');if(!b)return;if(b.dataset.mc==='add'){var d=document.getElementById('md').value;if(!d)return;S.match=S.match||[];S.match.push({id:'m'+Date.now(),date:d,time:document.getElementById('mt2').value,opp:document.getElementById('mo').value.trim().slice(0,30),ha:document.getElementById('mh').value})}else S.match=(S.match||[]).filter(function(x){return x.id!==b.dataset.id});save();render('k')});
render()})();
</script></body></html>
